name: Pre-publish Validation

on:
  pull_request:
    branches: [main]

jobs:
  check-version:
    runs-on: [self-hosted, oci, arm64]
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Check version bump
        run: |
          git fetch origin main
          MAIN_VERSION=$(git show origin/main:package.json | jq -r .version)
          PR_VERSION=$(jq -r .version package.json)
          
          echo "Version in main: $MAIN_VERSION"
          echo "Version in PR: $PR_VERSION"
          
          if [ "$(npx semver -r ">$MAIN_VERSION" $PR_VERSION)" == "" ]; then
            echo "::error::Version in PR ($PR_VERSION) must be strictly greater than version in main ($MAIN_VERSION)!"
            exit 1
          fi
          
          echo "✅ Version check passed ($PR_VERSION > $MAIN_VERSION)"
