# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: [self-hosted, oci, arm64]

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Rebuild native dependencies (for older GLIBC/GCC compatibility on self-hosted)
      run: |
        rm -rf node_modules/better-sqlite3/prebuilds
        sed -i 's/c++20/c++2a/g' node_modules/better-sqlite3/binding.gyp
        npm run build-release --prefix node_modules/better-sqlite3
    - run: npm run build
    - run: npm run lint
    - run: npm test
    - run: npm run test:smoke
